spring:
  application:
    name: foody-tracker
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/foody;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  h2:
    console:
      enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: FOODY_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true
app:
  docs-enabled: ${DOCS_ENABLED:true}
